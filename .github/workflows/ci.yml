# Vérifie chaque pull request et chaque push sur main :
# tests de l'API sur un vrai PostgreSQL, types et compilation du site, construction de l'image Railway.
# Le déploiement lui-même est fait par Railway (redéploiement automatique à chaque push sur main).
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (tests sur PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: igeya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/igeya_test
        run: python -m pytest -v
      - name: Connecteurs chargés sans erreur
        run: python -m app.tester

  site:
    name: Site (types et compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Image Railway (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t igeya-enrich .
      - name: Le site compilé est dans l'image
        run: docker run --rm --entrypoint sh igeya-enrich -c "test -f /app/site/index.html && ls /app/site"
